    // ─── Helpers ──────────────────────────────────────────────────────────────────
    function avatar(name, size = 32) {
      const init = (name || "?").trim().split(" ").pop()[0].toUpperCase();
      return `<div style="width:${size}px;height:${size}px;border-radius:50%;background:#9ca3af;display:flex;align-items:center;justify-content:center;color:#fff;font-size:${Math.round(size * 0.38)}px;font-weight:700;flex-shrink:0;border:1.5px solid #d1d5db">${init}</div>`;
    }
    function tagBadge(label) {
      const M = { "Hành Test": { bg: "#dbeafe", color: "#1d4ed8", border: "#bfdbfe" }, "Dzu": { bg: "#fef9c3", color: "#854d0e", border: "#fde68a" } };
      const s = M[label] || { bg: "#f3f4f6", color: "#374151", border: "#e5e7eb" };
      return `<span style="padding:1px 6px;border-radius:3px;font-size:10px;font-weight:600;background:${s.bg};color:${s.color};border:1px solid ${s.border};display:inline-flex;align-items:center;gap:2px"><span style="font-size:7px">▼</span>${label}</span>`;
    }
    function minibar(pct, color) {
      return `<div style="height:5px;background:#e5e7eb;border-radius:3px;overflow:hidden;flex:1"><div style="height:100%;width:${Math.min(pct, 100)}%;background:${color};border-radius:3px;transition:width .4s"></div></div>`;
    }
    function admbar(pct, color, h = 5) {
      return `<div style="height:${h}px;background:${SLATE[100]};border-radius:3px;overflow:hidden;flex:1"><div style="height:100%;width:${Math.min(pct, 100)}%;background:${color};border-radius:3px;transition:width .4s"></div></div>`;
    }

    // ─── Derived getters ──────────────────────────────────────────────────────────
    function getFiltered() {
      const base = state.activeLeadView === "unassigned" ? getUnassigned() : state.leads;
      if (!state.search) return base;
      const q = state.search.toLowerCase();
      return base.filter(l => l.name.toLowerCase().includes(q) || l.phone.includes(q) || l.code.toLowerCase().includes(q));
    }
    function getUnassigned() { return state.leads.filter(l => !l.assignee || l.assignee === "") }
    function byStage(id) { return getFiltered().filter(l => l.status === id) }
    function stageTotal(id) { return getFiltered().filter(l => l.status === id).reduce((s, l) => s + (l.expectedRevenue || 0), 0) }
    function grandTotal() { return state.leads.reduce((s, l) => s + (l.expectedRevenue || 0), 0) }

    // ─── Render engine ────────────────────────────────────────────────────────────
    function render() {
      document.getElementById("app").innerHTML = renderApp();
      bindEvents();
    }

    function renderApp() {
      return `
  <div style="display:flex;height:100vh;background:#f3f4f6;font-family:'Inter','Segoe UI',system-ui,sans-serif;overflow:hidden">
    ${renderSidebar()}
    ${renderLeftPanel()}
    ${renderMain()}
    ${state.selectedLead ? renderLeadModal() : ""}
    ${state.showAddModal ? renderAddModal() : ""}
    ${state.openAlert ? renderAlertPanel() : ""}
  </div>`;
    }

    // ─── Sidebar ─────────────────────────────────────────────────────────────────
    function renderSidebar() {
      const items = [
        { id: "filter", icon: svg.filter() },
        { id: "leads", icon: svg.leads() },

    ${items.map(it => `<button data-sidebar="${it.id}" style="width:32px;height:32px;border-radius:6px;border:none;cursor:pointer;background:${state.activeSidebar === it.id ? "rgba(255,255,255,0.13)" : "transparent"};color:${state.activeSidebar === it.id ? "#fff" : "#5a6680"};display:flex;align-items:center;justify-content:center;margin-bottom:2px">${it.icon}</button>`).join("")}

    <div style="width:26px;height:26px;border-radius:50%;background:#323d52;margin-bottom:10px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#888">A</div>
  </div>`;
    }

    // ─── Left Panel ───────────────────────────────────────────────────────────────
    function renderLeftPanel() {
      const unassignedCount = getUnassigned().length;
      const sec = (label, open, toggleKey, content) => `
    <div style="margin-bottom:2px">
      <div data-toggle="${toggleKey}" style="padding:6px 12px;display:flex;align-items:center;gap:5px;cursor:pointer;font-size:11.5px;font-weight:600;color:#374151">

      </div>
      ${open ? content : ""}
    </div>`;
      const navItem = (id, label, count, urgent) => {
        const active = state.activeLeadView === id;
        return `<div data-nav="${id}" style="padding:5px 10px 5px 22px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-size:11.5px;color:${active ? "#e8333a" : "#555"};background:${active ? "#fff5f5" : "transparent"};border-left:2px solid ${active ? "#e8333a" : "transparent"};border-radius:0 4px 4px 0">
      <span style="font-weight:${active ? 600 : 400}">${label}</span>
      <span style="background:${urgent ? "#fee2e2" : "#f3f4f6"};border-radius:8px;padding:0 5px;font-size:10px;color:${urgent ? "#dc2626" : "#777"};font-weight:${urgent ? 700 : 400}">${count}</span>
    </div>`;
      };
      const funnelItems = FUNNELS.map(f => {
        const active = state.activeFunnel === f.id && state.activeLeadView === "funnel";
        return `<div data-funnel="${f.id}" style="margin:2px 6px;padding:5px 8px;border-radius:5px;cursor:pointer;background:${active ? "#fff0f0" : "transparent"};border:1px solid ${active ? "#fecaca" : "transparent"};display:flex;justify-content:space-between;align-items:center">
      <div>
        <div style="font-size:11.5px;font-weight:600;color:${active ? "#e8333a" : "#444"}">${f.label}</div>
        <div style="font-size:10px;color:#aaa">${f.count} leads</div>
      </div>
    </div>`;
      }).join("");
      const campaignItems = CAMPAIGNS.map(c => {
        const active = state.activeLeadView === "campaign_" + c.id;
        return `<div data-campaign="${c.id}" style="margin:2px 6px;padding:5px 8px;border-radius:5px;cursor:pointer;background:${active ? "#fff0f0" : "transparent"};border:1px solid ${active ? "#fecaca" : "transparent"};font-size:11.5px;font-weight:${active ? 600 : 400};color:${active ? "#e8333a" : "#555"};border-left:${active ? "2px solid #e8333a" : "2px solid transparent"}">${c.label}</div>`;

    <div style="padding:6px 10px;border-bottom:1px solid #f0f0f0">
      <div style="background:#f5f6f7;border-radius:5px;padding:4px 9px;display:flex;align-items:center;gap:5px">
        ${svg.search()}
        <span style="font-size:11px;color:#bbb">Tìm kiếm...</span>
      </div>

      ${sec("Danh mục Lead", state.leftLeadsOpen, "leftLeads", navItem("all", "Tất cả lead", state.leads.length, false) + navItem("unassigned", "Chưa phân công", unassignedCount, unassignedCount > 0))}

  </div>`;

    // Hàm re-render modal live khi người dùng gõ phím để check trùng lặp 
    window.renderAddModalLive = function () {
      const n = document.getElementById("nl_name")?.value || "";
      const p = document.getElementById("nl_phone")?.value || "";
      const e = document.getElementById("nl_email")?.value || "";
      state.newLead = { ...state.newLead, name: n, phone: p, email: e };
      state.showAddModal = true;
      render();

      // Khôi phục giá trị input tránh bị mất focus khi gõ
      setTimeout(() => {
        const elPhone = document.getElementById("nl_phone");
        if (elPhone) { elPhone.focus(); const len = elPhone.value.length; elPhone.setSelectionRange(len, len); }
      }, 0);
    };

    // ─── Campaign Dashboard ───────────────────────────────────────────────────────
    function renderCampaignDashboard() {
      const cl = state.campLeads;
      const allL = cl.length;
      const qualified = cl.filter(l => l.score >= 70).length;
      const contacted = cl.filter(l => l.status !== "new").length;
      const consulting = cl.filter(l => ["consulting", "closing", "enrolled"].includes(l.status)).length;
      const closing = cl.filter(l => ["closing", "enrolled"].includes(l.status)).length;
      const enrolled = cl.filter(l => l.status === "enrolled").length;
      const totalCost = CAMP_SOURCES.reduce((s, src) => s + src.leads * src.cpl, 0);
      const cpl = allL ? Math.round(totalCost / allL) : 0;
      const convRate = allL ? Math.round(enrolled / allL * 100) : 0;
      const tab = state.campTab;
      const kpi = [
        { label: "Tổng Leads", value: allL, sub: "chiến dịch tháng 3", color: TEAL[700], bg: TEAL[50], icon: svg.user(TEAL[700], 13) },
        { label: "Qualified Leads", value: qualified, sub: `${Math.round(qualified / allL * 100)}% tổng leads`, color: TEAL[600], bg: TEAL[50], icon: svg.check(TEAL[600], 13) },
        { label: "Tỷ lệ liên hệ", value: Math.round(contacted / allL * 100) + "%", sub: `${contacted}/${allL} leads`, color: TEAL[500], bg: TEAL[50], icon: svg.phone(TEAL[500], 13) },
        { label: "Tỷ lệ tư vấn", value: Math.round(consulting / allL * 100) + "%", sub: `${consulting} đang tư vấn`, color: TEAL[600], bg: TEAL[100], icon: svg.msg(TEAL[600], 13) },
        { label: "Tỷ lệ nộp hồ sơ", value: Math.round(closing / allL * 100) + "%", sub: `${closing} hồ sơ`, color: TEAL[700], bg: TEAL[100], icon: svg.doc(TEAL[700], 13) },
        { label: "Chi phí / Lead", value: cpl.toLocaleString("vi-VN") + "₫", sub: "trung bình chiến dịch", color: TEAL[800], bg: TEAL[100], icon: svg.coin(TEAL[800], 13) },
        { label: "Tỷ lệ chuyển đổi", value: convRate + "%", sub: `${enrolled} nhập học`, color: TEAL[900], bg: TEAL[100], icon: svg.target(TEAL[900], 13) },
      ];
      return `<div style="flex:1;display:flex;flex-direction:column;overflow:hidden;background:#f8fafc">
    <div style="background:#fff;border-bottom:1px solid #e5e7eb;padding:0 20px;flex-shrink:0">
      <div style="display:flex;align-items:center;gap:10px;padding-top:12px;padding-bottom:8px">
        <div style="width:32px;height:32px;border-radius:7px;background:${BLUE[600]};display:flex;align-items:center;justify-content:center">${svg.target("#fff", 16)}</div>
        <div>
          <div style="font-size:15px;font-weight:700;color:#111">Chiến dịch tháng 3</div>
          <div style="font-size:11.5px;color:#9ca3af">01/03/2026 – 31/03/2026 · Đang hoạt động</div>
        </div>
        <div style="margin-left:auto;display:flex;gap:8px;align-items:center">
          <span style="background:${BLUE[50]};color:${BLUE[700]};font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:12px;border:1px solid ${BLUE[200]};display:flex;align-items:center;gap:4px">
            <span style="width:6px;height:6px;border-radius:50%;background:${BLUE[500]};display:inline-block"></span>Đang chạy
          </span>
          <button style="padding:6px 14px;border:1px solid #e5e7eb;border-radius:6px;background:#fff;font-size:12px;cursor:pointer;color:#374151">Chỉnh sửa</button>
        </div>
      </div>
      <div style="display:flex;gap:0">
        ${[{ id: "overview", l: "Tổng quan" }, { id: "sources", l: "Phân tích nguồn" }, { id: "pipeline", l: "Pipeline" }, { id: "automation", l: "Automation" }].map(t => `<button data-camptab="${t.id}" style="padding:8px 16px;border:none;background:transparent;border-bottom:${tab === t.id ? `2px solid ${BLUE[600]}` : "2px solid transparent"};color:${tab === t.id ? BLUE[600] : "#6b7280"};font-size:12.5px;font-weight:${tab === t.id ? 600 : 400};cursor:pointer">${t.l}</button>`).join("")}
      </div>
    </div>
    <div style="flex:1;overflow-y:auto;padding:16px">
      ${tab === "overview" ? renderCampOverview(allL, contacted, consulting, closing, enrolled, kpi) : ""}
      ${tab === "sources" ? renderCampSources(cpl, totalCost) : ""}
      ${tab === "pipeline" ? renderCampPipeline() : ""}
      ${tab === "automation" ? renderCampAutomation() : ""}
    </div>
  </div>`;
    }
    function renderCampOverview(allL, contacted, consulting, closing, enrolled, kpi) {
      const funnelData = [
        { label: "Lead mới", v: allL, color: TEAL[300] },
        { label: "Liên hệ", v: contacted, color: TEAL[400] },
        { label: "Tư vấn", v: consulting, color: TEAL[500] },
        { label: "Hồ sơ", v: closing, color: TEAL[700] },
        { label: "Nhập học", v: enrolled, color: TEAL[900] },
      ];
      return `<div style="display:flex;flex-direction:column;gap:14px">
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:10px">
      ${kpi.map(k => `<div style="background:#fff;border-radius:8px;padding:14px 12px;border:1px solid ${TEAL[100]}">
        <div style="width:28px;height:28px;border-radius:6px;background:${k.bg};display:flex;align-items:center;justify-content:center;margin-bottom:8px">${k.icon}</div>
        <div style="font-size:20px;font-weight:800;color:${k.color};line-height:1;margin-bottom:4px">${k.value}</div>
        <div style="font-size:10.5px;font-weight:600;color:#374151;margin-bottom:2px">${k.label}</div>
        <div style="font-size:10px;color:#9ca3af">${k.sub}</div>
      </div>`).join("")}
    </div>
    <div style="background:#fff;border-radius:8px;border:1px solid #e5e7eb;padding:16px">
      <div style="font-size:13px;font-weight:600;color:#374151;margin-bottom:14px">Phễu tuyển sinh</div>
      <div style="display:flex;align-items:flex-end;gap:10px;height:180px">
        ${funnelData.map((b, i) => {
        const pct = allL ? Math.round(b.v / allL * 100) : 0; const h = Math.max(18, Math.round(pct * 1.2)); return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">
          <div style="font-size:13px;font-weight:700;color:${b.color}">${b.v}</div>
          <div style="width:100%;height:${h}px;background:${b.color};border-radius:4px 4px 0 0"></div>
          <div style="font-size:10px;color:#6b7280;text-align:center">${b.label}</div>
          <div style="font-size:10.5px;font-weight:600;color:${b.color}">${pct}%</div>
        </div>`}).join("")}
      </div>
    </div>
    <div style="background:#fff;border-radius:8px;border:1px solid #e5e7eb;padding:16px">
      <div style="font-size:13px;font-weight:600;color:#374151;margin-bottom:12px">Top nguồn lead</div>
      <div style="display:flex;flex-direction:column;gap:9px">
        ${[...CAMP_SOURCES].sort((a, b) => b.leads - a.leads).slice(0, 5).map((s, i) => {
          const shades = [BLUE[900], BLUE[700], BLUE[600], BLUE[500], BLUE[400]];
          const c = shades[i] || BLUE[500];
          const total = CAMP_SOURCES.reduce((t, x) => t + x.leads, 0);
          const pct = Math.round(s.leads / total * 100);
          return `<div style="display:flex;align-items:center;gap:10px">
            <span style="width:6px;height:6px;border-radius:50%;background:${c};flex-shrink:0"></span>
            <span style="font-size:12px;color:#374151;width:104px;flex-shrink:0">${s.label}</span>
            ${minibar(pct, c)}
            <span style="font-size:12px;font-weight:600;color:${c};width:28px;text-align:right;flex-shrink:0">${s.leads}</span>
            <span style="font-size:10.5px;color:#9ca3af;width:30px;text-align:right;flex-shrink:0">${pct}%</span>
          </div>`;
        }).join("")}
      </div>
    </div>
  </div>`;
    }
    function renderCampSources(cpl, totalCost) {
      return `<div style="background:#fff;border-radius:8px;border:1px solid #e5e7eb;overflow:hidden">
    <div style="padding:12px 16px;border-bottom:1px solid #f0f0f0;display:flex;justify-content:space-between;align-items:center">
      <span style="font-size:13px;font-weight:600;color:#374151">Phân tích theo nguồn lead</span>
      <span style="font-size:11.5px;color:#9ca3af">Tổng: ${CAMP_SOURCES.reduce((s, x) => s + x.leads, 0)} leads</span>
    </div>
    <table style="width:100%;border-collapse:collapse">
      <thead><tr style="background:#fafafa;border-bottom:1px solid #f0f0f0">
        ${["Nguồn", "Số Lead", "Lead CL (≥70đ)", "Tỷ lệ liên hệ", "Tỷ lệ chuyển đổi", "Chi phí/Lead", "Tổng chi phí", "Hiệu quả"].map(h => `<th style="padding:9px 12px;text-align:left;font-size:10.5px;font-weight:600;color:#9ca3af;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap">${h}</th>`).join("")}
      </tr></thead>
      <tbody>
        ${CAMP_SOURCES.map((s, idx) => {
        const rowColor = [BLUE[900], BLUE[800], BLUE[700], BLUE[600], BLUE[600], BLUE[500], BLUE[500]][idx] || BLUE[600];
        const eff = s.converted >= 30 ? { label: "Xuất sắc", color: BLUE[700], bg: BLUE[100] } : s.converted >= 20 ? { label: "Tốt", color: BLUE[600], bg: BLUE[50] } : s.converted >= 15 ? { label: "Trung bình", color: "#374151", bg: "#f3f4f6" } : { label: "Cần cải thiện", color: "#6b7280", bg: "#f3f4f6" };
        const total = CAMP_SOURCES.reduce((t, x) => t + x.leads, 0);
        return `<tr style="border-bottom:1px solid #f5f5f5" onmouseenter="this.style.background='${BLUE[50]}'" onmouseleave="this.style.background='#fff'">
            <td style="padding:11px 12px"><div style="display:flex;align-items:center;gap:8px"><span style="width:8px;height:8px;border-radius:50%;background:${rowColor};flex-shrink:0"></span><span style="font-size:12.5px;font-weight:600;color:#111">${s.label}</span></div></td>

      <textarea placeholder="Ghi chú nhanh cho nhóm xử lý..." rows="2" style="width:100%;padding:7px 10px;border:1px solid #e5e7eb;border-radius:6px;font-size:12px;resize:none;outline:none;box-sizing:border-box;color:#374151"></textarea>
      <div style="display:flex;justify-content:flex-end;margin-top:8px;gap:8px">
        <button onclick="state.openAlert=null;render()" style="padding:6px 14px;border:1px solid #e5e7eb;border-radius:6px;background:#fff;font-size:12px;cursor:pointer;color:#6b7280">Đóng</button>
        <button onclick="alertMarkResolved(${JSON.stringify(leads.map(l => l.id))});render()" style="padding:6px 14px;border:none;border-radius:6px;background:${TEAL[600]};font-size:12px;cursor:pointer;color:#fff;font-weight:600">Đánh dấu tất cả đã xử lý</button>
      </div>

    function renderAlert2(leads, resolved, selected, sty) {

    <div style="padding:9px 16px;border-bottom:1px solid #f0f0f0;background:${SLATE[50]};flex-shrink:0;display:flex;align-items:center;gap:8px">
      <input type="checkbox" ${selected.length === leads.length ? "checked" : ""} onchange="alertSelectAll(2,this.checked)" style="cursor:pointer">
      <span style="font-size:11.5px;color:#6b7280">${selected.length > 0 ? selected.length + " đã chọn" : "Chọn tất cả"}</span>
      ${selected.length > 0 ? `<select style="padding:3px 7px;border:1px solid #e5e7eb;border-radius:5px;font-size:11.5px;outline:none"><option value="">Phân công tư vấn...</option>${ASSIGNEES.map(a => `<option>${a}</option>`).join("")}</select>${alertActionBtn(`alertMarkResolved([${selected.join(",")}])`, svg.check("#fff", 11) + " Assign (" + selected.length + ")", "#fff", TEAL[600], TEAL[600])}` : ""}
      <span style="margin-left:auto;font-size:11px;color:#9ca3af">${leads.filter(l => !resolved.includes(l.id)).length} chờ tư vấn</span>
    </div>
    <div style="flex:1;overflow-y:auto">
      ${leads.map(lead => {
        const done = resolved.includes(lead.id); const sel = selected.includes(lead.id); return `<div style="display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid #f5f5f5;background:${done ? "#f9fafb" : sel ? TEAL[50] : "#fff"};opacity:${done ? 0.55 : 1}"
        onmouseenter="if(!${done})this.style.background='${TEAL[50]}'" onmouseleave="if(!${done}&&!${sel})this.style.background='#fff'">
        <input type="checkbox" ${sel ? "checked" : ""} ${done ? "disabled" : ""} onchange="alertToggleSelect(${lead.id})" style="cursor:pointer">
        ${avatar(lead.name, 28)}
        <div style="flex:1;min-width:0">
          <div style="font-size:12.5px;font-weight:600;color:#111;margin-bottom:1px">${lead.name}</div>
          <div style="font-size:11px;color:#9ca3af;display:flex;gap:8px"><span>${lead.phone}</span><span style="color:${TEAL[600]}">${lead.major}</span></div>
          <div style="font-size:10.5px;color:#6b7280;margin-top:2px">Hành động cuối: ${lead.lastAction}</div>
        </div>
        <div style="text-align:right;flex-shrink:0;margin-right:8px">
          <div style="background:#fef3c7;color:#92400e;font-size:11px;font-weight:700;padding:2px 7px;border-radius:8px;display:inline-block">Score: ${lead.score}</div>
          <div style="font-size:10.5px;color:${lead.assignee ? "#9ca3af" : "#dc2626"};margin-top:3px">${lead.assignee || "Chưa phân công"}</div>
        </div>
        ${!done ? alertActionBtn(`alertMarkResolved([${lead.id}])`, `Tư vấn ngay`, "#fff", TEAL[600], TEAL[700]) : `<span style="font-size:10.5px;color:${TEAL[600]};font-weight:600;display:flex;align-items:center;gap:3px">${svg.check(TEAL[600], 11)} Xong</span>`}
      </div>`}).join("")}
    </div>
    <div style="padding:12px 16px;border-top:1px solid #f0f0f0;flex-shrink:0;display:flex;justify-content:flex-end;gap:8px">
      <button onclick="state.openAlert=null;render()" style="padding:6px 14px;border:1px solid #e5e7eb;border-radius:6px;background:#fff;font-size:12px;cursor:pointer;color:#6b7280">Đóng</button>
      <button onclick="alertMarkResolved(${JSON.stringify(leads.map(l => l.id))});render()" style="padding:6px 14px;border:none;border-radius:6px;background:${TEAL[600]};font-size:12px;cursor:pointer;color:#fff;font-weight:600">Assign tất cả</button>
    </div>`;
    }
    function renderAlert3(camps, resolved, sty) {
      return `
    <div style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px">
      ${camps.map(camp => {
        const done = resolved.includes(camp.id); return `<div style="background:${done ? "#f9fafb" : "#fff"};border:1px solid ${done ? TEAL[200] : "#e5e7eb"};border-radius:8px;padding:14px 16px;opacity:${done ? 0.7 : 1}">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
          <div style="font-size:13px;font-weight:700;color:#111">${camp.label}</div>
          ${done ? `<span style="font-size:11px;color:${TEAL[600]};font-weight:600;display:flex;align-items:center;gap:3px">${svg.check(TEAL[600], 10)} Đã xử lý</span>` : `<span style="background:#fee2e2;color:#dc2626;font-size:11px;font-weight:600;padding:2px 7px;border-radius:7px">Cần cải thiện</span>`}
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;margin-bottom:12px">
          ${[{ l: "Tổng leads", v: camp.leads }, { l: "Chuyển đổi", v: camp.converted }, { l: "Tỷ lệ", v: camp.rate }, { l: "CPL", v: (camp.cpl / 1000) + "k ₫" }].map(s => `<div style="background:${SLATE[50]};border-radius:6px;padding:8px 10px"><div style="font-size:10px;color:#9ca3af;margin-bottom:3px">${s.l}</div><div style="font-size:14px;font-weight:700;color:${TEAL[700]}">${s.v}</div></div>`).join("")}
        </div>
        ${!done ? `<div style="display:flex;gap:8px;flex-wrap:wrap">
          ${alertActionBtn(`alertMarkResolved(['${camp.id}'])`, `Tối ưu ngân sách`, "#fff", TEAL[600], TEAL[700])}
          ${alertActionBtn(`alertMarkResolved(['${camp.id}'])`, `Điều chỉnh targeting`, TEAL[700], TEAL[50], TEAL[200])}
          ${alertActionBtn(`alertMarkResolved(['${camp.id}'])`, `Tạm dừng chiến dịch`, "#92400e", "#fef3c7", "#fde68a")}
        </div>`: ""}
      </div>`}).join("")}
    </div>
    <div style="padding:12px 16px;border-top:1px solid #f0f0f0;flex-shrink:0;display:flex;justify-content:flex-end">
      <button onclick="state.openAlert=null;render()" style="padding:6px 16px;border:none;border-radius:6px;background:${TEAL[600]};font-size:12px;cursor:pointer;color:#fff;font-weight:600">Đóng</button>
    </div>`;
    }
    function renderAlert4(leads, resolved, selected, sty) {
      return `
    <div style="padding:9px 16px;border-bottom:1px solid #f0f0f0;background:${SLATE[50]};flex-shrink:0;display:flex;align-items:center;gap:8px">
      <input type="checkbox" ${selected.length === leads.length ? "checked" : ""} onchange="alertSelectAll(4,this.checked)" style="cursor:pointer">
      <span style="font-size:11.5px;color:#6b7280">${selected.length > 0 ? selected.length + " đã chọn" : "Chọn tất cả"}</span>
      ${selected.length > 0 ? alertActionBtn(`alertMarkResolved([${selected.join(",")}])`, svg.check("#fff", 11) + " Duyệt hồ sơ (" + selected.length + ")", "#fff", "#d97706", "#d97706") : ""}
      <span style="margin-left:auto;font-size:11px;color:#9ca3af">${leads.filter(l => !resolved.includes(l.id)).length} chờ duyệt</span>
    </div>
    <div style="flex:1;overflow-y:auto">
      ${leads.map(lead => {
        const done = resolved.includes(lead.id); const sel = selected.includes(lead.id); const urgent = lead.waitHours >= 72; return `<div style="display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid #f5f5f5;background:${done ? "#f9fafb" : sel ? "#fffbeb" : "#fff"};opacity:${done ? 0.55 : 1}"
        onmouseenter="if(!${done})this.style.background='#fffbeb'" onmouseleave="if(!${done}&&!${sel})this.style.background='#fff'">
        <input type="checkbox" ${sel ? "checked" : ""} ${done ? "disabled" : ""} onchange="alertToggleSelect(${lead.id})" style="cursor:pointer">
        ${avatar(lead.name, 28)}
        <div style="flex:1;min-width:0">
          <div style="font-size:12.5px;font-weight:600;color:#111;margin-bottom:1px">${lead.name}</div>
          <div style="font-size:11px;color:#9ca3af;display:flex;gap:8px"><span>${lead.phone}</span><span style="color:${TEAL[600]}">${lead.major}</span><span>Nộp: ${lead.submitted}</span></div>
        </div>
        <div style="text-align:right;flex-shrink:0;margin-right:8px">
          <div style="font-size:11.5px;font-weight:700;color:${urgent ? "#dc2626" : "#d97706"};margin-bottom:2px">${lead.waitHours}h chờ</div>
          <div style="font-size:10.5px;color:#9ca3af">${lead.assignee}</div>
        </div>
        ${!done ? `<div style="display:flex;gap:5px">${alertActionBtn(`alertMarkResolved([${lead.id}])`, `Duyệt`, "#fff", "#d97706", "#d97706")}${alertActionBtn(`alertMarkResolved([${lead.id}])`, `Từ chối`, "#dc2626", "#fff1f0", "#fecaca")}</div>` : `<span style="font-size:10.5px;color:${TEAL[600]};font-weight:600;display:flex;align-items:center;gap:3px">${svg.check(TEAL[600], 11)} Xong</span>`}
      </div>`}).join("")}
    </div>
    <div style="padding:12px 16px;border-top:1px solid #f0f0f0;flex-shrink:0;display:flex;justify-content:flex-end;gap:8px">
      <button onclick="state.openAlert=null;render()" style="padding:6px 14px;border:1px solid #e5e7eb;border-radius:6px;background:#fff;font-size:12px;cursor:pointer;color:#6b7280">Đóng</button>
      <button onclick="alertMarkResolved(${JSON.stringify(leads.map(l => l.id))});render()" style="padding:6px 14px;border:none;border-radius:6px;background:#d97706;font-size:12px;cursor:pointer;color:#fff;font-weight:600">Duyệt tất cả</button>
    </div>`;
    }

    // ─── Event binding ────────────────────────────────────────────────────────────
    function bindEvents() {
      // Sidebar
      document.querySelectorAll("[data-sidebar]").forEach(el => el.addEventListener("click", e => { state.activeSidebar = el.dataset.sidebar; render(); }));
      // Nav
      document.querySelectorAll("[data-nav]").forEach(el => el.addEventListener("click", e => { state.activeLeadView = el.dataset.nav; if (el.dataset.nav !== "unassigned") state.activeFunnel = null; render(); }));
      // Toggle sections
      document.querySelectorAll("[data-toggle]").forEach(el => el.addEventListener("click", e => { const k = el.dataset.toggle + "Open"; state[k] = !state[k]; render(); }));
      // Funnels
      document.querySelectorAll("[data-funnel]").forEach(el => el.addEventListener("click", e => { state.activeFunnel = el.dataset.funnel; state.activeLeadView = "funnel"; render(); }));
      // Campaigns
      document.querySelectorAll("[data-campaign]").forEach(el => el.addEventListener("click", e => { state.activeLeadView = "campaign_" + el.dataset.campaign; render(); }));
      // View mode
      document.querySelectorAll("[data-view]").forEach(el => el.addEventListener("click", e => { state.viewMode = el.dataset.view; render(); }));
      // Search
      const srch = document.getElementById("mainSearch");
      if (srch) srch.addEventListener("input", e => { state.search = e.target.value; render(); });
      // Add lead btn(s)
      document.querySelectorAll("#btnAddLead").forEach(el => el.addEventListener("click", e => { state.showAddModal = true; render(); }));
      // Kanban cards
      document.querySelectorAll("[data-leadcard]").forEach(el => el.addEventListener("click", e => { const lead = state.leads.find(l => l.id === parseInt(el.dataset.leadcard)); if (lead) { state.selectedLead = lead; state.modalForm = { ...lead, quality: lead.quality || "normal" }; state.modalNotes = lead.notes || []; state.modalTasks = []; state.modalTab = "customer"; state.modalRightTab = "info"; render(); } }));
      // Table rows
      document.querySelectorAll("[data-leadrow]").forEach(el => el.addEventListener("click", e => { const lead = state.leads.find(l => l.id === parseInt(el.dataset.leadrow)); if (lead) { state.selectedLead = lead; state.modalForm = { ...lead, quality: lead.quality || "normal" }; state.modalNotes = lead.notes || []; state.modalTasks = []; state.modalTab = "customer"; state.modalRightTab = "info"; render(); } }));
      // Assign dropdown in unassigned
      document.querySelectorAll("[data-assign]").forEach(el => el.addEventListener("change", e => { if (!e.target.value) return; const id = parseInt(el.dataset.assign); state.leads = state.leads.map(l => l.id === id ? { ...l, assignee: e.target.value } : l); render(); }));
      // Modal
      const mc = document.getElementById("modalClose"); if (mc) mc.addEventListener("click", () => { state.selectedLead = null; render(); });
      const mcn = document.getElementById("modalCancel"); if (mcn) mcn.addEventListener("click", () => { state.selectedLead = null; render(); });
      const mcs = document.getElementById("modalSave"); if (mcs) mcs.addEventListener("click", () => { saveModal(); });
      const mb = document.getElementById("leadModalBg"); if (mb) mb.addEventListener("click", e => { if (e.target === mb) { state.selectedLead = null; render(); } });
      document.querySelectorAll("[data-modaltab]").forEach(el => el.addEventListener("click", e => { state.modalTab = el.dataset.modaltab; render(); }));
      document.querySelectorAll("[data-modalright]").forEach(el => el.addEventListener("click", e => { state.modalRightTab = el.dataset.modalright; render(); }));
      document.querySelectorAll("[data-setstage]").forEach(el => el.addEventListener("click", e => { if (state.modalForm) { state.modalForm.status = el.dataset.setstage; state.leads = state.leads.map(l => l.id === state.selectedLead.id ? { ...l, status: el.dataset.setstage } : l); render(); } }));
      const an = document.getElementById("addNote"); if (an) an.addEventListener("click", addNote);
      const nt = document.getElementById("newNote"); if (nt) nt.addEventListener("keydown", e => { if (e.key === "Enter") addNote(); });
      const at = document.getElementById("addTask"); if (at) at.addEventListener("click", addTask);
      const nTask = document.getElementById("newTask"); if (nTask) nTask.addEventListener("keydown", e => { if (e.key === "Enter") addTask(); });
      document.querySelectorAll("[data-tasktoggle]").forEach(el => el.addEventListener("change", e => { const i = parseInt(el.dataset.tasktoggle); state.modalTasks = state.modalTasks.map((t, j) => j === i ? { ...t, done: !t.done } : t); render(); }));
      document.querySelectorAll("[data-taskdel]").forEach(el => el.addEventListener("click", e => { const i = parseInt(el.dataset.taskdel); state.modalTasks = state.modalTasks.filter((_, j) => j !== i); render(); }));
      // Add modal
      const amc = document.getElementById("addModalClose"); if (amc) amc.addEventListener("click", () => { state.showAddModal = false; render(); });
      const amcn = document.getElementById("addModalCancel"); if (amcn) amcn.addEventListener("click", () => { state.showAddModal = false; render(); });
      const ams = document.getElementById("addModalSubmit"); if (ams) ams.addEventListener("click", () => handleAddLead(false));
      const amcall = document.getElementById("addModalCall"); if (amcall) amcall.addEventListener("click", () => handleAddLead(true));
      const amBg = document.getElementById("addModalBg"); if (amBg) amBg.addEventListener("click", e => { if (e.target === amBg) { state.showAddModal = false; render(); } });
      // Campaign
      document.querySelectorAll("[data-camptab]").forEach(el => el.addEventListener("click", e => { state.campTab = el.dataset.camptab; render(); }));
      document.querySelectorAll("[data-campflowtoggle]").forEach(el => el.addEventListener("click", e => { const id = parseInt(el.dataset.campflowtoggle); state.campFlows = state.campFlows.map(f => f.id === id ? { ...f, status: f.status === "active" ? "paused" : "active" } : f); render(); }));
      const cfa = document.getElementById("campFilterAssignee"); if (cfa) cfa.addEventListener("change", e => { state.campFilterAssignee = e.target.value; render(); });
      const cfs = document.getElementById("campFilterSource"); if (cfs) cfs.addEventListener("change", e => { state.campFilterSource = e.target.value; render(); });
      // Admission
      document.querySelectorAll("[data-admtab]").forEach(el => el.addEventListener("click", e => { state.admTab = el.dataset.admtab; render(); }));
      document.querySelectorAll("[data-admflowtoggle]").forEach(el => el.addEventListener("click", e => { const id = parseInt(el.dataset.admflowtoggle); state.admFlows = state.admFlows.map(f => f.id === id ? { ...f, status: f.status === "active" ? "paused" : "active" } : f); render(); }));
      // Alert open
      document.querySelectorAll("[data-openalert]").forEach(el => el.addEventListener("click", e => { state.openAlert = parseInt(el.dataset.openalert); state.alertResolvedItems = []; state.alertSelected = []; render(); }));
    }

    // ─── Drag & Drop ──────────────────────────────────────────────────────────────
    function onCardDragStart(e, id) { state.dragId = id; e.dataTransfer.effectAllowed = "move"; }
    function onStageDragOver(e, id) { e.preventDefault(); if (state.dragOverStage !== id) { state.dragOverStage = id; document.querySelectorAll("[data-stage]").forEach(el => { const isOver = el.dataset.stage === id; const zone = el.querySelector("div:last-child"); if (zone) { zone.style.background = isOver ? TEAL[50] : "transparent"; zone.style.border = `1.5px dashed ${isOver ? TEAL[400] : "transparent"}`; } }); } }
    function onStageDragLeave() { state.dragOverStage = null; document.querySelectorAll("[data-stage]").forEach(el => { const zone = el.querySelector("div:last-child"); if (zone) { zone.style.background = "transparent"; zone.style.border = "1.5px dashed transparent"; } }); }
    function onStageDrop(e, id) { e.preventDefault(); if (state.dragId != null) { state.leads = state.leads.map(l => l.id === state.dragId ? { ...l, status: id } : l); state.dragId = null; state.dragOverStage = null; render(); } }
    function onCampCardDragStart(e, id) { state.campDragId = id; e.dataTransfer.effectAllowed = "move"; }
    function onCampStageDragOver(e, id) { e.preventDefault(); state.campDragOver = id; }
    function onCampStageDragLeave() { state.campDragOver = null; }
    function onCampStageDrop(e, id) { e.preventDefault(); if (state.campDragId) { state.campLeads = state.campLeads.map(l => l.id === state.campDragId ? { ...l, status: id } : l); state.campDragId = null; state.campDragOver = null; render(); } }

    // ─── Action handlers ──────────────────────────────────────────────────────────
    function addNote() { const el = document.getElementById("newNote"); if (!el || !el.value.trim()) return; state.modalNotes = [{ text: el.value.trim(), time: new Date().toLocaleString("vi-VN"), author: "Admin" }, ...state.modalNotes]; render(); }
    function addTask() { const el = document.getElementById("newTask"); if (!el || !el.value.trim()) return; state.modalTasks = [...state.modalTasks, { text: el.value.trim(), done: false }]; render(); }
    function saveModal() {
      if (!state.modalForm) return;
      const name = document.getElementById("mf_name")?.value || state.modalForm.name;
      const phone = document.getElementById("mf_phone")?.value || state.modalForm.phone;
      const email = document.getElementById("mf_email")?.value || state.modalForm.email;
      const province = document.getElementById("mf_province")?.value || state.modalForm.province;
      const address = document.getElementById("mf_address")?.value || state.modalForm.address;
      const expRev = parseInt(document.getElementById("mf_expectedRevenue")?.value) || state.modalForm.expectedRevenue;
      const assignee = document.getElementById("modalAssignee")?.value || state.modalForm.assignee;
      const gender = document.querySelector("[name=modal_gender]:checked")?.value || state.modalForm.gender;
      const updated = { ...state.modalForm, name, phone, email, province, address, expectedRevenue: expRev, assignee, gender, notes: state.modalNotes };
      state.leads = state.leads.map(l => l.id === updated.id ? updated : l);
      state.selectedLead = null; render();
    }
    function handleAddLead(callNow = false) {
      const nl = state.newLead;
      const name = document.getElementById("nl_name")?.value || "";
      const phone = document.getElementById("nl_phone")?.value || "";
      if (!name || !phone) {
        alert("Vui lòng nhập Họ tên và Số điện thoại hợp lệ.");
        return;
      }

      // Tags parse
      let tgsRaw = document.getElementById("nl_tags")?.value || "";
      let tags = tgsRaw.split(",").map(t => t.trim()).filter(t => t);

      const assig = document.getElementById("nl_assignee")?.value === "auto" ? ASSIGNEES[Math.floor(Math.random() * ASSIGNEES.length)] : (document.getElementById("nl_assignee")?.value || ASSIGNEES[0]);

      const lead = {
        name, phone,
        email: document.getElementById("nl_email")?.value || "",
        school: "",
        source: document.getElementById("nl_source")?.value || SOURCES[0],
        major: document.getElementById("nl_major")?.value || MAJORS[0],
        assignee: assig,
        province: document.getElementById("nl_province")?.value || "",
        address: "",
        gender: document.getElementById("nl_gender")?.value || "Khác",
        id: Date.now(),
        code: mkId(),
        status: document.getElementById("nl_status")?.value || "new",
        score: 85,
        createdAt: new Date().toLocaleString("vi-VN"),
        notes: [
          { text: "Tự động tạo task Gọi tư vấn lần 1 sau 15 phút.", time: new Date().toLocaleString("vi-VN"), author: "System Automation" },
          { text: "Tự động gửi SMS chào mừng và Email brochure.", time: new Date().toLocaleString("vi-VN"), author: "System Automation" }
        ],
        tags: tags,
        expectedRevenue: 0, revenue: 0, orders: 0, rfm: 0, membership: "-"
      };

      state.leads = [lead, ...state.leads];
      state.showAddModal = false;
      state.newLead = { name: "", phone: "", email: "", source: "Facebook", major: "Công nghệ thông tin", school: "", gender: "Khác", province: "", address: "", assignee: "auto", expectedRevenue: "" };

      if (callNow) {
        // Kích hoạt mô phỏng gọi điện ngay và xem chi tiết
        state.selectedLead = lead;
        state.modalForm = { ...lead, quality: "normal" };
        state.modalNotes = lead.notes || [];
        state.modalTasks = [];
        state.modalTab = "customer";
        state.modalRightTab = "info";
        alert(`Đang mở giao diện kết nối gọi điện cho ${lead.name} (${lead.phone})...`);
      }

      render();
    }
    function closeAlertPanel(e) { if (e.target === e.currentTarget) { state.openAlert = null; render(); } }
    function alertToggleSelect(id) { const s = state.alertSelected; state.alertSelected = s.includes(id) ? s.filter(x => x !== id) : [...s, id]; render(); }
    function alertSelectAll(alertId, checked) {
      const leads = ALERT_LEADS[alertId];
      state.alertSelected = checked ? leads.map(l => l.id) : []; render();
    }
    function alertMarkResolved(ids) {
      ids.forEach(id => { if (!state.alertResolvedItems.includes(id)) state.alertResolvedItems.push(id); });
      state.alertSelected = [];
      // Update resolved alerts badge
      const alertId = state.openAlert;
      const total = ALERT_LEADS[alertId]?.length || 1;
      if (state.alertResolvedItems.length >= total) {
        if (!state.resolvedAlerts.includes(alertId)) state.resolvedAlerts.push(alertId);
      }
      render();
    }

    // ─── Init ─────────────────────────────────────────────────────────────────────
    render();
  </script>
</body>

</html>
